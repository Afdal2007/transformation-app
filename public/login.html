<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cahier de Performance - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-container {
      max-width: 400px;
      width: 100%;
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }

    .auth-container h1 {
      text-align: center;
      font-size: 2rem;
      color: #667eea;
      margin-bottom: 30px;
    }

    .auth-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .tab.active {
      border-color: #667eea;
      background: #f0f4ff;
      color: #667eea;
    }

    .auth-form {
      display: none;
      flex-direction: column;
      gap: 15px;
    }

    .auth-form.active {
      display: flex;
    }

    input {
      padding: 12px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    button {
      padding: 12px 20px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    #error {
      color: #f56565;
      margin-top: 10px;
      text-align: center;
      font-weight: 500;
    }

    #error.success {
      color: #48bb78;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <h1>🎯 Performance</h1>
    
    <div class="auth-tabs">
      <div class="tab active" onclick="switchTab('login')">Login</div>
      <div class="tab" onclick="switchTab('register')">Register</div>
    </div>

    <div id="login" class="auth-form active">
      <input type="text" id="loginUser" placeholder="Utilisateur">
      <input type="password" id="loginPass" placeholder="Mot de passe">
      <button onclick="login()">Se connecter</button>
    </div>

    <div id="register" class="auth-form">
      <input type="text" id="regUser" placeholder="Utilisateur">
      <input type="email" id="regEmail" placeholder="Email">
      <input type="password" id="regPass" placeholder="Mot de passe">
      <button onclick="register()">S'inscrire</button>
    </div>

    <div id="error"></div>
  </div>

  <script>
    const API = 'http://localhost/transformation-app/api';

    function switchTab(tab) {
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      event.target.classList.add('active');
    }

    async function login() {
      const user = document.getElementById('loginUser').value;
      const pass = document.getElementById('loginPass').value;
      
      if (!user || !pass) return showError('Remplis les champs');
      
      const res = await fetch(API + '/auth.php?action=login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: user, password: pass })
      });
      
      const data = await res.json();
      if (data.success) {
        localStorage.setItem('userId', data.id);
        localStorage.setItem('username', user);
        window.location.href = 'index.html';
      } else {
        showError(data.error);
      }
    }

    async function register() {
      const user = document.getElementById('regUser').value;
      const email = document.getElementById('regEmail').value;
      const pass = document.getElementById('regPass').value;
      
      if (!user || !email || !pass) return showError('Remplis tous les champs');
      
      const res = await fetch(API + '/auth.php?action=register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: user, email, password: pass })
      });
      
      const data = await res.json();
      if (data.success) {
        showError('Compte créé ! Connecte-toi maintenant.', 'success');
        setTimeout(() => switchTab('login'), 1500);
      } else {
        showError(data.error);
      }
    }

    function showError(msg, type = 'error') {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.classList.remove('success');
      if (type === 'success') el.classList.add('success');
    }
  </script>
</body>
</html>
